<h2>Books</h2>
<div class="placeholder-box mb-3">
  <strong>Open Library search (coming soon)</strong>
  <div class="input-group mt-2">
    <input type="text" class="form-control" placeholder="Search book title or ISBN">
    <button class="btn btn-dark" onclick="searchOpenLibrary()">Search</button>
  </div>
  <div id="apiResult" class="mt-2 small"></div>
</div>
<button class="btn btn-dark mb-3" onclick="openModal('Add')">Add book</button>
<div class="table-responsive">
  <table class="table table-hover mb-0">
    <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>ISBN</th><th>Copies</th><th>Actions</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <form id="itemForm">
      <div class="modal-header"><h5 class="modal-title"><span id="modalTitle">Add</span> book</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Title</label><input type="text" name="title" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Author</label><input type="text" name="author" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Category</label><input type="text" name="category" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">ISBN</label><input type="text" name="isbn" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Copies</label><input type="number" name="copies" class="form-control" required></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-dark">Save</button>
      </div>
    </form>
  </div></div>
</div>
