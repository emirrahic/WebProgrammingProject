<div class="auth-box card p-4">
  <h2>Register</h2>
  <form id="registerForm">
    <div class="mb-3"><label class="form-label">Full name</label><input type="text" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" minlength="6" required></div>
    <button class="btn btn-dark w-100" type="submit">Create account</button>
  </form>
  <p class="mt-3 mb-0">Already registered? <a href="#login">Log in</a></p>
</div>
